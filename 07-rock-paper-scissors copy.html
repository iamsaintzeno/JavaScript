<!DOCTYPE html>
<html>
    <head>
        <title>Rock-Paper-Scissors</title>
    </head>
    <body style="font-family: Arial;">
        <p>Rock-Paper-Scissors</p>
        <button onclick="
                playGame('rock');
            ">Rock</button>
    
        <button onclick="
                playGame('paper'); 
            ">Paper</button>

        <button onclick="
            playGame('scissors'); 
            ">Scissors</button>
        <script>

            function playGame(move){
                const computerMove = pickCompMove(); 
                let result = '';
                if(move==='scissors'){
                    if(computerMove==='scissors'){
                        result = 'tie' ;
                    } else if(computerMove==='paper'){
                        result = 'win';
                    }
                    else if(computerMove==='rock'){
                        result = 'lose' ;
                    }
                }
                else if(move==='paper'){
                    if(computerMove==='rock'){
                        result = 'win' ;
                    } else if(computerMove==='paper'){
                        result = 'tie';
                    }
                    else if(computerMove==='scissors'){
                        result = 'lose' ;
                    }
                    
                }
                else if(move==='rock'){
                    if(computerMove==='rock'){
                        result = 'tie' ;
                    } else if(computerMove==='paper'){
                        result = 'lose';
                    }
                    else if(computerMove==='scissors'){
                        result = 'win' ;
                    }
                }
                
    
                alert(`you picked ${move} and Computer Picked ${computerMove} . You ${result}.` ) ;

            }
            
            function pickCompMove(){
                let computerMove = '' ;
                const randomNum = Math.random();
                if(randomNum>=0 && randomNum < 1/3){
                    computerMove = 'rock' ;
                }
                else if(randomNum>=1/3 && randomNum<2/3){
                    computerMove = 'paper' ;
                }
                else if(randomNum>=2/3 && randomNum<1){
                    computerMove = 'scissors' ;
                }
    
                return computerMove;
            }
        </script>
    </body>
</html>
