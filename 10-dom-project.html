<!DOCTYPE html>
<html>
    <head>
        <title>DOM-Projects</title>
        <style>

            body {
                font-family: arial;
            }

            .Youtube-section ,.game-section, .Amazon-section {
                margin-bottom: 50px;
            }
            .subscribe-button{
                background-color: black;
                color: white;
                font-weight: 700;
                font-style: solid;
                padding: 10px 15px 10px 15px;
                border: none;
                border-radius: 50px;
                cursor: pointer;
            }

            .is-subscribed{
                background-color: rgb(241, 241, 241);
                color: black;
            }

            .cost-input{
                font-size: 15px;
                padding : 10px;
            }

            .calculate-button{
                font-weight: solid;
                font-size: 15px;
                color: white;
                background-color: green;
                padding: 12px 15px;
                border: none;
            }

            
        </style>
    </head>
    <body>
        <div class="Youtube-section">
            <p>Youtube Subscribe Button</p>
            <button class="js-button subscribe-button" onclick="
                Subscribe();
            ">Subscribe</button>
        </div>

        <div class="game-section">
            <p>Rock Paper Scissor Game</p>
            <a href="./10-rock-paper-scissors.html">Click Here</a>
        </div>

        <div class="Amazon-section">
            <p>Amazon Shipping Calculator</p>
            <p>Order Under $40 += $10 Shipping.</p>
            <p>Order over $40 = Free Shipping.</p>
        
            <input class="js-cost-input cost-input" placeholder="Cost of Order" onkeydown="
                        handleCostKeyDown(event);
                    ">

            <button class="calculate-button" onclick="
                    calcTotal() ;
                ">Calculate</button>
        
            <p class="js-total-cost"></p>
        </div>
        <script>

            String(25);
            console.log('25'-5);
            console.log('25'+5);

            window.document
            window.console.log('window')
            window.alert

           function handleCostKeyDown(event){
            if(event.key === 'Enter') {
                    calcTotal() ;
                }
           } 

            function calcTotal(){
                const inputElement = document.querySelector('.js-cost-input') ;
                let cost = Number(inputElement.value) ;
                

                if(cost < 40) {
                    cost = cost + 10 ;
                }
                document.querySelector('.js-total-cost').innerHTML = `$${cost}` ;
            }
            
            function Subscribe(){
                const buttonEle = (document.querySelector('.js-button'));

                if(buttonEle.innerText === 'Subscribe'){
                    buttonEle.innerHTML = 'Subscribed';
                    buttonEle.classList.add('is-subscribed');
                }
                else {
                buttonEle.innerHTML = 'Subscribe' ;
                buttonEle.classList.remove('is-subscribed');
                }
        }
        </script>
    </body>
</html>
